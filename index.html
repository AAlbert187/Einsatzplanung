<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Einsatzplanung</title>
</head>
<body>

<h1>Einsatzplanung</h1>

<button onclick="setName('Denis')">
Denis
</button>

<button onclick="setName('Patrick')">
Patrick
</button>

<script>
function setName(name) {
    alert(name + " wurde ausgewählt");
}
</script>

</body>
</html>
